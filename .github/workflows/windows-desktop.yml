name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/windows-desktop.yml]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      MAX_JOBS: '2'
      DISTUTILS_USE_SDK: '1'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
      - name: Prepare the NVIDIA CUDA 13.0 build tools
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest = Invoke-RestMethod "$base/redistrib_13.0.0.json"
          $cuda = Join-Path $env:RUNNER_TEMP cuda13
          New-Item -ItemType Directory -Path $cuda | Out-Null
          foreach ($name in 'cuda_nvcc','cuda_crt','cuda_cccl','cuda_cudart','libnvvm') {
            $item = $manifest.$name.'windows-x86_64'
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            curl.exe --fail --retry 3 --silent --show-error "$base/$($item.relative_path)" -o $zip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ine $item.sha256) { throw "Invalid CUDA archive $name" }
            $expanded = Join-Path $env:RUNNER_TEMP $name
            Expand-Archive -LiteralPath $zip -DestinationPath $expanded
            $component = Get-ChildItem $expanded -Directory | Select-Object -First 1
            Get-ChildItem $component.FullName -Directory | Copy-Item -Destination $cuda -Recurse -Force
            Remove-Item $zip,$expanded -Recurse -Force
          }
          & "$cuda/bin/nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          "CUDA_HOME=$cuda" >> $env:GITHUB_ENV
          "$cuda/bin" >> $env:GITHUB_PATH
      - name: Stage and verify the native inference runtime
        shell: pwsh
        run: |
          $pythonRoot = Split-Path (Get-Command python).Source
          $runtime = Join-Path $env:RUNNER_TEMP farstack-runtime
          python desktop/build_windows_runtime.py $pythonRoot $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FARSTACK_RUNTIME_DIR=$runtime" >> $env:GITHUB_ENV
      - name: Test and package the desktop
        shell: pwsh
        run: |
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop run test:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop run package:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packagedPython = (Resolve-Path 'desktop/dist/win-unpacked/resources/farstack-runtime/python.exe').Path
          & $packagedPython -I -c "import torch; import longctx.desktop_worker; import freetoken.kernel._pinned_tensor; assert torch.version.cuda.startswith('13.')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedRuntime = (Get-Item $packagedPython).Directory
          Get-ChildItem "$installedRuntime/Lib/site-packages/torch/lib" -Filter 'torch_cuda.dll' -ErrorAction Stop | Out-Null
          npm --prefix desktop run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FARSTACK_ELECTRON = (Resolve-Path 'desktop/dist/win-unpacked/FarStack.exe').Path
          $env:FARSTACK_TEST_PACKAGED = '1'
          npm --prefix desktop run test:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem desktop/dist/FarStack-*-Windows-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii ($_.FullName + '.sha256')
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: farstack-windows-x64
          path: |
            desktop/dist/FarStack-*-Windows-x64.exe
            desktop/dist/FarStack-*-Windows-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
