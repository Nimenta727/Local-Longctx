[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-longctx"
version = "0.1.0"
description = "Low-resource local long-context inference control plane"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
longctx = "longctx.cli:main"

[tool.setuptools.packages.find]
include = ["longctx*"]
