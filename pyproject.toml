[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-longctx"
version = "0.2.0"
description = "FreeToken-only MoE research control plane"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
longctx = "longctx.cli:main"

[tool.setuptools.packages.find]
include = ["longctx*"]
