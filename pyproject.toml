[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-longctx"
version = "0.3.0a3"
description = "Local-Longctx Studio: experimental local MoE control plane"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
longctx = "longctx.cli:main"

[tool.setuptools.packages.find]
include = ["longctx*"]

[project.urls]
Repository = "https://github.com/Nimenta727/Local-Longctx"
